<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8A3" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C1E" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0088A8" />
    </linearGradient>

    <!-- Bolt Inner Highlight -->
    <linearGradient id="boltCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00D2FF" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Dark Navy Premium Badge Background so icon pops in ANY browser theme -->
  <rect width="128" height="128" rx="26" fill="#071324" stroke="url(#goldLinear)" stroke-width="3" />

  <!-- Outer Geometric Triangle Frame -->
  <polygon points="64,16 114,102 14,102" fill="none" stroke="url(#goldLinear)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Second Concentric Triangle Layer -->
  <polygon points="64,25 106,97 22,97" fill="none" stroke="url(#goldLinear)" stroke-width="2" stroke-linejoin="round" opacity="0.9" />

  <!-- Third Inner Triangle Frame -->
  <polygon points="64,34 98,92 30,92" fill="none" stroke="url(#goldLinear)" stroke-width="1.8" stroke-linejoin="round" opacity="0.75" />

  <!-- Central Gear Cog Motif -->
  <circle cx="64" cy="68" r="19" fill="#0B1E38" stroke="url(#goldLinear)" stroke-width="2.5" />
  <circle cx="64" cy="68" r="11" fill="none" stroke="url(#goldLinear)" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Gear Teeth radiating around center -->
  <g stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round">
    <line x1="64" y1="46" x2="64" y2="49" />
    <line x1="64" y1="87" x2="64" y2="90" />
    <line x1="42" y1="68" x2="45" y2="68" />
    <line x1="83" y1="68" x2="86" y2="68" />
    <line x1="49" y1="53" x2="51" y2="55" />
    <line x1="77" y1="81" x2="79" y2="83" />
    <line x1="79" y1="53" x2="77" y2="55" />
    <line x1="51" y1="81" x2="49" y2="83" />
  </g>

  <!-- Electric Cyan Lightning Bolt with Gold Border & Glow -->
  <!-- Outer Gold Rim of Bolt -->
  <polygon
    points="77,24 53,62 67,62 51,112 75,70 61,70"
    fill="none"
    stroke="#FFE8A3"
    stroke-width="5"
    stroke-linejoin="miter"
    stroke-miterlimit="4"
  />

  <!-- Main Cyan Lightning Body with Glow -->
  <polygon
    points="77,24 53,62 67,62 51,112 75,70 61,70"
    fill="url(#cyanLinear)"
    stroke="url(#cyanLinear)"
    stroke-width="2"
    stroke-linejoin="miter"
    filter="url(#cyanGlow)"
  />

  <!-- Core White Highlight for Brilliant Electric Shine -->
  <polygon
    points="75,28 55,61 68,61 54,106 73,71 60,71"
    fill="url(#boltCore)"
    opacity="0.85"
  />
</svg>